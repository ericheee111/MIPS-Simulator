name: Validate follow-up source
on:
  push:
    branches: [refactor/simulator-correctness]
    paths: [.github/workflows/followup-import.yml]
permissions:
  contents: read
jobs:
  validate-import:
    if: github.repository == 'ericheee111/MIPS-Simulator' && github.ref == 'refs/heads/refactor/simulator-correctness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MIPS_GUI_SCREENSHOT: ${{ github.workspace }}/evidence/gui.png
      MIPS_DEMO_DIR: ${{ github.workspace }}/evidence/demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify original branch and exact source payload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          expected = '9e48c8a983e7fb13f5147d26b5a7e8c2f4c1607c'
          subprocess.run(['git','merge-base','--is-ancestor',expected,'HEAD'],check=True)
          changed = subprocess.check_output(['git','diff','--name-only',expected,'HEAD']).decode().splitlines()
          assert changed == ['.github/workflows/followup-import.yml'], changed
          shas = ['e5d7f4e9e42cb2aa98afebc40368c3288592fa2d','5a9d8231257732e21d5d03dfbd49cf646b8b19e7','a9d86ea620a4c77511880fc9292e886c7354fc34','0f3989d45f34155f6b214afc075c45744cb14223','415353bfc0ad1f33c4b2a0be952885ed34dce0ef','725e7548556f8329552deb572043052dd0443099','ba1c98ff3fca7509361a31e8cfe93a048f4d14fb']
          chunks = []
          for sha in shas:
              request = urllib.request.Request('https://api.github.com/repos/ericheee111/MIPS-Simulator/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              chunks.append(base64.b64decode(blob['content']))
          packed = b''.join(chunks)
          assert len(packed) == 34376
          assert hashlib.sha256(packed).hexdigest() == 'a3fd601eb8f59f6a4509debac594700ffa44d7e14b90cdd7a478c4f098fd2d76'
          raw = lzma.decompress(packed)
          assert len(raw) == 140428
          assert hashlib.sha256(raw).hexdigest() == 'cbf888b96880137aab155bba5ed64117cbdceade956f1278626e45e75abef81d'
          data = json.loads(raw)
          assert data['expected_base'] == expected and len(data['files']) == 37
          for name, content in data['files'].items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in ('.git','.github'), name
              target = pathlib.Path(name)
              assert not target.is_symlink()
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8',newline='')
          subprocess.run(['git','add','--',*data['files']],check=True)
          pathlib.Path('evidence/source-manifest.json').write_bytes(raw)
          print('37 source/test/documentation files verified and staged; workflows excluded')
          PY
          git diff --cached --check
          git diff --cached --stat > evidence/changes.txt
      - name: Install Qt dependencies
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev ninja-build
      - name: Strict Qt build and full retained plus new tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DMIPS_BUILD_GUI=ON -DSTRICT=ON -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee evidence/configure.log
          cmake --build build --parallel 2 2>&1 | tee evidence/build.log
          ctest --test-dir build --output-on-failure 2>&1 | tee evidence/ctest.log
          ./build/unit_tests 2>&1 | tee evidence/unit-tests.log
      - name: Publish source only after Qt verification passes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/simulator-correctness | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: harden execution control and add bounded debugging, fuzzing, and packaging'
          git push origin HEAD:refs/heads/refactor/simulator-correctness
          git rev-parse HEAD | tee evidence/published-commit.txt
      - name: Preserve test and source evidence
        if: always()
        run: |
          mkdir -p evidence
          git diff --cached --binary > evidence/staged.patch
          git bundle create evidence/source-history.bundle --all HEAD
          if [ -d build/Testing ]; then cp -r build/Testing evidence/; fi
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: followup-import-evidence
          path: evidence/
          retention-days: 14
