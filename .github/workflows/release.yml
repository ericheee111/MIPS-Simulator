name: Build draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check tag matches packaged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release_tag.py "$RELEASE_TAG"
  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
  draft:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: package-*
          path: packages
          merge-multiple: true
      - name: Create reviewable draft with checksums, never publish implicitly
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd packages
          find . -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          mapfile -d '' files < <(find . -type f -print0)
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "MIPS Simulator $RELEASE_TAG" \
            --notes 'Validated packages. Review verification scope, third-party notices and SHA256SUMS before publishing.' "${files[@]}"
