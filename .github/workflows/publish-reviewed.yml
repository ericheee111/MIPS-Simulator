name: Validate reviewed implementation
on:
  push:
    branches: [refactor/simulator-correctness]
    paths: [.github/workflows/publish-reviewed.yml]
permissions:
  contents: read
jobs:
  validate-and-import:
    if: github.repository == 'ericheee111/MIPS-Simulator' && github.ref == 'refs/heads/refactor/simulator-correctness'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MIPS_GUI_SCREENSHOT: ${{ github.workspace }}/evidence/gui.png
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify publication base and import exact reviewed objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git rev-parse HEAD^)" = fb509e2c51def9f3f0b92ed2f736ee026129a6aa
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          blobs = [
              'cdc41ad3d83cdffea60dc28dc4ec9dbde2a7ae85',
              '8950eb4402922d5928afb1c897cb006a9bd5c580',
              '3ed4b5fc5f6d78e9876f8a609f9cb09fdfb473fb',
              'e63a455294e96c2f229d9e5eba34d4c88c7bfac8',
              'e636a7fd37406313da64c30982584f7cd53ee134',
              '981e3f1a484b51a435497098eba31386a7bdd9e6',
          ]
          chunks = []
          for sha in blobs:
              req = urllib.request.Request(
                  'https://api.github.com/repos/ericheee111/MIPS-Simulator/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == sha and blob['encoding'] == 'base64'
              chunks.append(base64.b64decode(blob['content']))
          compressed = b''.join(chunks)
          assert len(compressed) == 34592
          assert hashlib.sha256(compressed).hexdigest() == '0c9ed699a8697b09da8e487f272c352fffdff41ade5a15fc361670c19e44a15e'
          bundle = lzma.decompress(compressed)
          assert len(bundle) == 135127
          assert hashlib.sha256(bundle).hexdigest() == '29dda6b04c42b4ed932ec6a238132b16f2f2d20a9d9330786631f5de2b8a8ffb'
          pathlib.Path('/tmp/reviewed.bundle').write_bytes(bundle)
          print('Reviewed bundle: both SHA256 digests verified')
          PY
          git bundle verify /tmp/reviewed.bundle
          git fetch /tmp/reviewed.bundle HEAD:refs/remotes/reviewed/source
          test "$(git rev-parse refs/remotes/reviewed/source)" = e9095a447f74ca8ceb35ea727d0019f41222af54
          test "$(git rev-parse e9095a447f74ca8ceb35ea727d0019f41222af54^)" = da34bbf6a4bd4fd2cf594450d044847c1bc62ee7
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', '-z', 'e9095a447f74ca8ceb35ea727d0019f41222af54']).decode().split('\0')
          for path in filter(None, paths):
              assert not path.startswith(('/', '.git/', '.github/')) and '..' not in path.split('/'), path
          print('Reviewed commit contains source, tests and documentation only')
          PY
          git cherry-pick --no-commit e9095a447f74ca8ceb35ea727d0019f41222af54
          git diff --cached --check
          git diff --cached --stat > evidence/changes.txt
      - name: Install Qt build dependencies
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev ninja-build
      - name: Strict C++11 and Qt build
        shell: bash
        run: |
          set -euo pipefail
          g++ --version | tee evidence/compiler.txt
          cmake -S . -B build -G Ninja -DMIPS_BUILD_GUI=ON -DSTRICT=ON -DCMAKE_BUILD_TYPE=Debug 2>&1 | tee evidence/configure.log
          cmake --build build --parallel 2 2>&1 | tee evidence/build.log
      - name: Run all original and new tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee evidence/ctest.log
          ./build/unit_tests 2>&1 | tee evidence/unit-tests.log
      - name: Publish only after the full Qt validation passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -C e9095a447f74ca8ceb35ea727d0019f41222af54
          git push origin HEAD:refs/heads/refactor/simulator-correctness
          git rev-parse HEAD | tee evidence/published-commit.txt
      - name: Collect reproducible evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git status --short > evidence/worktree-status.txt
          git diff --cached --binary > evidence/staged.patch
          git bundle create evidence/source-history.bundle --all HEAD
          if [ -d build/Testing ]; then cp -r build/Testing evidence/; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-implementation-evidence
          path: evidence/
          retention-days: 14
